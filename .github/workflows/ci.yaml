name: Test Baton contentful Integration

on: pull_request

env:
  BATON_LOG_LEVEL: debug
  BATON_TOKEN: "${{ secrets.BATON_TOKEN }}"
  BATON_ORGANIZATION_ID: "${{ secrets.BATON_ORGANIZATION_ID }}"

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  test-spaces:
    runs-on: ubuntu-latest

    env:
      CONNECTOR_GRANT: "${{ vars.TEST_SPACES_GRANT }}"
      CONNECTOR_ENTITLEMENT: "${{ vars.TEST_SPACES_ENTITLEMENT }}"
      CONNECTOR_PRINCIPAL: "${{ vars.TEST_SPACES_PRINCIPAL }}"
      CONNECTOR_PRINCIPAL_TYPE: "${{ vars.TEST_PRINCIPAL_TYPE || 'user' }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-contentful
        run: go build ./cmd/baton-contentful
      - name: Run baton-contentful
        run: ./baton-contentful
      - name: Install baton
        uses: ConductorOne/github-workflows/actions/get-baton@v2

      - name: Ensure grant exists before revoking
        run: |
          ./baton-contentful && \
          if ! baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
               jq -e ".grants[]?.principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\"" > /dev/null; then
            echo "Grant does not exist, creating it first..."
            ./baton-contentful --grant-entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
                              --grant-principal="${{ env.CONNECTOR_PRINCIPAL }}" \
                              --grant-principal-type="${{ env.CONNECTOR_PRINCIPAL_TYPE }}"
            ./baton-contentful
          else
            echo "Grant already exists, proceeding with revoke test..."
          fi

      - name: Verify grant exists before revoking
        run: |
          baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
          jq --exit-status ".grants[].principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\"" | grep -q "true"

      - name: Revoke grants
        run: ./baton-contentful --revoke-grant="${{ env.CONNECTOR_GRANT }}"

      - name: Check grant was revoked
        run: |
          ./baton-contentful && \
          baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
          jq --exit-status "if .grants then .grants[]?.principal.id.resource != \"${{ env.CONNECTOR_PRINCIPAL }}\" else . end"

      - name: Grant entitlement
        run: |
          ./baton-contentful --grant-entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
                          --grant-principal="${{ env.CONNECTOR_PRINCIPAL }}" \
                          --grant-principal-type="${{ env.CONNECTOR_PRINCIPAL_TYPE }}"

      - name: Check grant was re-granted
        run: |
          ./baton-contentful && \
          baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
          jq --exit-status ".grants[].principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\""


  test-teams:
    runs-on: ubuntu-latest
    env:
      CONNECTOR_GRANT: "${{ vars.TEST_TEAMS_GRANT }}"
      CONNECTOR_ENTITLEMENT: "${{ vars.TEST_TEAMS_ENTITLEMENT }}"
      CONNECTOR_PRINCIPAL: "${{ vars.TEST_TEAMS_PRINCIPAL }}"
      CONNECTOR_PRINCIPAL_TYPE: "${{ vars.TEST_PRINCIPAL_TYPE || 'user' }}"
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build baton-contentful
        run: go build ./cmd/baton-contentful
      - name: Run baton-contentful
        run: ./baton-contentful
      - name: Install baton
        uses: ConductorOne/github-workflows/actions/get-baton@v2

      # tests
      - name: Ensure grant exists before revoking
        run: |
          ./baton-contentful && \
          if ! baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
               jq -e ".grants[]?.principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\"" > /dev/null; then
            echo "Grant does not exist, creating it first..."
            ./baton-contentful --grant-entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
                              --grant-principal="${{ env.CONNECTOR_PRINCIPAL }}" \
                              --grant-principal-type="${{ env.CONNECTOR_PRINCIPAL_TYPE }}"
            ./baton-contentful
          else
            echo "Grant already exists, proceeding with revoke test..."
          fi

      - name: Verify grant exists before revoking
        run: |
          baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
          jq --exit-status ".grants[].principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\""

      - name: Revoke grants
        run: ./baton-contentful --revoke-grant="${{ env.CONNECTOR_GRANT }}"

      - name: Check grant was revoked
        run: |
          ./baton-contentful && \
          baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
          jq --exit-status "if .grants then .grants[]?.principal.id.resource != \"${{ env.CONNECTOR_PRINCIPAL }}\" else . end"

      - name: Grant entitlement
        run: |
          ./baton-contentful --grant-entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
                          --grant-principal="${{ env.CONNECTOR_PRINCIPAL }}" \
                          --grant-principal-type="${{ env.CONNECTOR_PRINCIPAL_TYPE }}"

      - name: Check grant was re-granted
        run: |
          ./baton-contentful && \
          baton grants --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" --output-format=json | \
          jq --exit-status ".grants[].principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\""

